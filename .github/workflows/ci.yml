name: SkillCam Mobile Test CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --check app-v6.js
      - run: test -f index.html
      - run: test -f styles-v6.css
      - run: test -f manifest.webmanifest
      - run: test -f sw.js
